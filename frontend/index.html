<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PawLah SG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23FBEAE0'/%3E%3Cg transform='translate(14,14) scale(1.5)' fill='%23E2672B'%3E%3Ccircle cx='6.5' cy='8' r='2.1'/%3E%3Ccircle cx='12' cy='5.6' r='2.3'/%3E%3Ccircle cx='17.5' cy='8' r='2.1'/%3E%3Cpath d='M12 10.5c-3.2 0-6.2 2.6-6.2 5.4 0 1.7 1.4 2.6 3 2.2 1.1-.3 2-1 3.2-1s2.1.7 3.2 1c1.6.4 3-.5 3-2.2 0-2.8-3-5.4-6.2-5.4z'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="wordmark">
    <span class="paw-mark" aria-hidden="true">
      <!-- <svg viewBox="0 0 24 24" width="22" height="22"><use href="#paw-icon"></use></svg> -->
      <img src="logo/miaava.png" width="35" height="35" alt="" style="border-radius:50%">
    </span>
    PawLah <span class="wordmark-sub">SG</span>
  </div>

  <div class="filters-wrap">
    <nav class="filters" id="filtersNav" aria-label="Category filters">
      <button class="pill active" data-filter="parks" title="Parks" aria-label="Parks">
        <svg class="pill-icon" viewBox="0 0 24 24" width="16" height="16"><use href="#tree-icon"></use></svg>
        <span class="pill-label">Parks</span>
      </button>
      <button class="pill" data-filter="malls" disabled title="Malls — coming soon" aria-label="Malls">
        <svg class="pill-icon" viewBox="0 0 24 24" width="16" height="16"><use href="#mall-icon"></use></svg>
        <span class="pill-label">Malls</span>
      </button>
      <button class="pill" data-filter="cafes" disabled title="Cafes — coming soon" aria-label="Cafes">
        <svg class="pill-icon" viewBox="0 0 24 24" width="16" height="16"><use href="#cafe-icon"></use></svg>
        <span class="pill-label">Cafes</span>
      </button>
      <button class="pill" data-filter="vets" disabled title="Vets — coming soon" aria-label="Vets">
        <svg class="pill-icon" viewBox="0 0 24 24" width="16" height="16"><use href="#vet-icon"></use></svg>
        <span class="pill-label">Vets</span>
      </button>
    </nav>
    <button class="filters-scroll-arrow" id="filtersScrollArrow" aria-label="Show more categories" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14"><use href="#arrow-icon"></use></svg>
    </button>
  </div>

  <div class="area-select-wrap" id="areaSelectWrap">
    <svg class="area-select-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><use href="#filter-icon"></use></svg>
    <span class="area-filter-dot" id="areaFilterDot" hidden></span>
    <select class="area-select" aria-label="Filter by area" id="areaSelect">
      <option value="">All areas</option>
    </select>
  </div>
</header>

<main class="layout">
  <aside class="sidebar" aria-label="Dog park list">
    <ul class="park-list" id="parkList"></ul>
  </aside>

  <section class="map-panel">
    <div id="map"></div>
  </section>
</main>

<button id="contributeFab" class="fab" aria-label="Contribute a location">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div id="contributeOverlay" class="modal-overlay" hidden>
  <div class="modal-card">
    <button id="contributeClose" class="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16"><use href="#close-icon"></use></svg>
    </button>
    <h2 class="modal-title">Suggest a location</h2>
    <p class="modal-sub">Know a dog friendly spot? Fill this in — anonymous is fine.</p>
    <form id="contributeForm">
      <label>Name <span class="optional">(optional)</span></label>
      <input type="text" id="cName" name="submitter_name">

      <label>Park name*</label>
      <input type="text" id="cParkName" name="park_name" required>

      <label>Address*</label>
      <input type="text" id="cAddress" name="address" required>

      <label>Details*</label>
      <textarea id="cDetails" name="details" rows="3" required placeholder="What makes it dog-friendly? Fenced? Shaded? Any tips?"></textarea>

      <label>Nearest carpark <span class="optional">(optional)</span></label>
      <input type="text" id="cCarpark" name="nearest_carpark">

      <!-- honeypot — hidden via CSS, real users wont fill this up -->
      <input type="text" id="cWebsite" name="website" class="hp-field" tabindex="-1" autocomplete="off">

      <button type="submit" class="modal-submit">Submit</button>
      <p id="contributeStatus"></p>
    </form>
  </div>
</div>

<!-- Shared icon sprite -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="paw-icon" fill="currentColor">
      <circle cx="6.5" cy="8" r="2.1"/>
      <circle cx="12" cy="5.6" r="2.3"/>
      <circle cx="17.5" cy="8" r="2.1"/>
      <path d="M12 10.5c-3.2 0-6.2 2.6-6.2 5.4 0 1.7 1.4 2.6 3 2.2 1.1-.3 2-1 3.2-1s2.1.7 3.2 1c1.6.4 3-.5 3-2.2 0-2.8-3-5.4-6.2-5.4z"/>
    </g>
    <g id="close-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <line x1="19" y1="5" x2="5" y2="19"/>
    </g>
    <g id="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="20" y2="12"/>
      <polyline points="13 5 20 12 13 19"/>
    </g>
    <g id="tree-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l4 6h-2.5l3.5 5.5h-3V19h-4v-4.5h-3l3.5-5.5H8z"/>
      <line x1="12" y1="19" x2="12" y2="21"/>
    </g>
    <g id="mall-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="16" height="13" rx="1"/>
      <line x1="4" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="8" x2="12" y2="3"/>
      <line x1="9" y1="21" x2="9" y2="14"/>
      <line x1="15" y1="21" x2="15" y2="14"/>
    </g>
    <g id="cafe-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3v6a2 2 0 002 2v10"/>
      <path d="M7 3v4M9 3v4M11 3v4"/>
      <path d="M16 3c-1.5 0-2.5 1.5-2.5 4s1 4 2.5 5v9"/>
    </g>
    <g id="vet-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </g>
    <g id="filter-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16l-6 7v6l-4 2v-8z"/>
    </g>
  </defs>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="app.js"></script>
</body>
</html>
