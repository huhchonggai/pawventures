<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pawmap SG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23FBEAE0'/%3E%3Cg transform='translate(14,14) scale(1.5)' fill='%23E2672B'%3E%3Ccircle cx='6.5' cy='8' r='2.1'/%3E%3Ccircle cx='12' cy='5.6' r='2.3'/%3E%3Ccircle cx='17.5' cy='8' r='2.1'/%3E%3Cpath d='M12 10.5c-3.2 0-6.2 2.6-6.2 5.4 0 1.7 1.4 2.6 3 2.2 1.1-.3 2-1 3.2-1s2.1.7 3.2 1c1.6.4 3-.5 3-2.2 0-2.8-3-5.4-6.2-5.4z'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="wordmark">
    <span class="paw-mark" aria-hidden="true">
      <!-- <svg viewBox="0 0 24 24" width="22" height="22"><use href="#paw-icon"></use></svg> -->
      <img src="logo/miaava.png" width="35" height="35" alt="" style="border-radius:50%">
    </span>
    Pawmap <span class="wordmark-sub">SG</span>
  </div>

  <nav class="filters" aria-label="Category filters">
    <button class="pill active" data-filter="parks">Parks</button>
    <button class="pill" data-filter="malls" disabled title="Coming soon">Malls</button>
    <button class="pill" data-filter="cafes" disabled title="Coming soon">Cafes</button>
    <button class="pill" data-filter="vets" disabled title="Coming soon">Vets</button>
  </nav>

  <select class="area-select" aria-label="Filter by area" id="areaSelect">
    <option value="">All areas</option>
  </select>
</header>

<main class="layout">
  <aside class="sidebar" aria-label="Dog park list">
    <ul class="park-list" id="parkList"></ul>
  </aside>

  <section class="map-panel">
    <div id="map"></div>
  </section>
</main>

<!-- Shared icon sprite -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="paw-icon" fill="currentColor">
      <circle cx="6.5" cy="8" r="2.1"/>
      <circle cx="12" cy="5.6" r="2.3"/>
      <circle cx="17.5" cy="8" r="2.1"/>
      <path d="M12 10.5c-3.2 0-6.2 2.6-6.2 5.4 0 1.7 1.4 2.6 3 2.2 1.1-.3 2-1 3.2-1s2.1.7 3.2 1c1.6.4 3-.5 3-2.2 0-2.8-3-5.4-6.2-5.4z"/>
    </g>
    <g id="close-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <line x1="19" y1="5" x2="5" y2="19"/>
    </g>
    <g id="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="20" y2="12"/>
      <polyline points="13 5 20 12 13 19"/>
    </g>
  </defs>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="app.js"></script>
</body>
</html>
